name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual dispatch exercises the same job as the daily audit.
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality gates
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Dependency updates can rebuild both profiling and dynamic-linking graphs.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            mold \
            pkg-config \
            python3-venv \
            ripgrep
          mold --version
      - name: Install Python test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-python"
          "$RUNNER_TEMP/quality-python/bin/python3" -m pip install --no-cache-dir --only-binary=:all: 'Pillow==12.3.0'
          "$RUNNER_TEMP/quality-python/bin/python3" -c 'from PIL import Image; assert hasattr(Image.Image, "get_flattened_data"); print("Pillow", Image.__version__)'
          echo "$RUNNER_TEMP/quality-python/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          spec = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']
          subprocess.run(['rustup', 'toolchain', 'install', spec['channel'],
                          '--profile', spec['profile'], '--no-self-update',
                          '--component', ','.join(spec['components'])], check=True)
          PY
      - name: Install pinned quality tools
        run: |
          python3 scripts/install_dev_tools.py --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Diagnose environment
        run: python3 scripts/dev.py doctor
      - name: Run quality gates
        env:
          HELL_WORKERS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/dev.py verify

  dependencies:
    name: Daily dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          spec = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']
          subprocess.run(['rustup', 'toolchain', 'install', spec['channel'],
                          '--profile', spec['profile'], '--no-self-update',
                          '--component', ','.join(spec['components'])], check=True)
          PY
      - name: Install pinned dependency auditor
        run: |
          python3 scripts/install_dev_tools.py --tool cargo-deny --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Audit dependencies
        run: python3 scripts/dev.py deps
