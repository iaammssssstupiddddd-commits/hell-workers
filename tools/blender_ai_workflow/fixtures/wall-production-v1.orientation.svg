<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840"
  data-contract-id="wall-production-v1" data-contract-sha256="d4090f72646856ced07e148feffccdc169cf865691b92fd7f4dc4f7d8ab61dd7">
  <title>Wall production v1 canonical orientation and bounds</title>
  <desc>Top-view canonical family arms use N=-Z, E=+X. Positive quarter turns about +Y are counterclockwise and map N to W. Side view fixes the centered local pivot and placement height.</desc>
  <style>
    .background { fill: #17131a; }
    .card { fill: #241d27; stroke: #6a596d; stroke-width: 2; }
    .cell { fill: none; stroke: #8c7b90; stroke-width: 2; stroke-dasharray: 6 5; }
    .wall { fill: #9b6047; stroke: #2a1714; stroke-width: 3; }
    .port { stroke: #d9a45e; stroke-width: 5; }
    .axis { stroke: #b89fbd; stroke-width: 3; marker-end: url(#arrow); }
    .dimension { stroke: #c9b6ce; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    .ground { stroke: #d9a45e; stroke-width: 4; }
    .pivot { fill: #d946ef; stroke: #fff; stroke-width: 2; }
    .label { fill: #f4eaf6; font: 700 18px sans-serif; }
    .detail { fill: #cdbed1; font: 14px monospace; }
    .heading { fill: #fff7ff; font: 700 28px sans-serif; }
    .accent { fill: #d9a45e; font: 700 16px sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#c9b6ce"/>
    </marker>
  </defs>
  <rect class="background" width="960" height="840"/>
  <text class="heading" x="30" y="44">wall-production-v1 — canonical top view</text>
  <text class="detail" x="30" y="72">N = −Z · E = +X · +90° about +Y: N → W (counterclockwise from above)</text>
  <line class="axis" x1="820" y1="92" x2="820" y2="42"/>
  <text class="accent" x="808" y="30">N</text>
  <line class="axis" x1="820" y1="92" x2="875" y2="92"/>
  <text class="accent" x="887" y="98">E</text>
  <path d="M786,84 A36,36 0 0 1 813,55" fill="none" stroke="#d946ef" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="detail" x="730" y="116">+Y ↺</text>

  <g data-family="isolated" data-canonical-mask="0000" data-arms="" transform="translate(30 130)">
    <rect class="card" width="280" height="180" rx="12"/>
    <text class="label" x="16" y="28">isolated</text><text class="detail" x="186" y="28">0000</text>
    <rect class="cell" x="80" y="42" width="120" height="120"/>
    <rect class="wall" x="122" y="84" width="36" height="36"/>
    <circle class="pivot" cx="140" cy="102" r="5"/>
  </g>
  <g data-family="end" data-canonical-mask="1000" data-arms="N" transform="translate(340 130)">
    <rect class="card" width="280" height="180" rx="12"/>
    <text class="label" x="16" y="28">end</text><text class="detail" x="186" y="28">1000</text>
    <rect class="cell" x="80" y="42" width="120" height="120"/>
    <rect class="wall" x="122" y="42" width="36" height="78"/>
    <line class="port" x1="122" y1="44" x2="158" y2="44"/>
    <circle class="pivot" cx="140" cy="102" r="5"/>
  </g>
  <g data-family="straight" data-canonical-mask="1100" data-arms="N S" transform="translate(650 130)">
    <rect class="card" width="280" height="180" rx="12"/>
    <text class="label" x="16" y="28">straight</text><text class="detail" x="186" y="28">1100</text>
    <rect class="cell" x="80" y="42" width="120" height="120"/>
    <rect class="wall" x="122" y="42" width="36" height="120"/>
    <line class="port" x1="122" y1="44" x2="158" y2="44"/><line class="port" x1="122" y1="160" x2="158" y2="160"/>
    <circle class="pivot" cx="140" cy="102" r="5"/>
  </g>
  <g data-family="corner" data-canonical-mask="1010" data-arms="N W" transform="translate(30 340)">
    <rect class="card" width="280" height="180" rx="12"/>
    <text class="label" x="16" y="28">corner</text><text class="detail" x="186" y="28">1010</text>
    <rect class="cell" x="80" y="42" width="120" height="120"/>
    <path class="wall" d="M80,84 H122 V42 H158 V120 H80 z"/>
    <line class="port" x1="82" y1="84" x2="82" y2="120"/><line class="port" x1="122" y1="44" x2="158" y2="44"/>
    <circle class="pivot" cx="140" cy="102" r="5"/>
  </g>
  <g data-family="t_junction" data-canonical-mask="1110" data-arms="N S W" transform="translate(340 340)">
    <rect class="card" width="280" height="180" rx="12"/>
    <text class="label" x="16" y="28">t_junction</text><text class="detail" x="186" y="28">1110</text>
    <rect class="cell" x="80" y="42" width="120" height="120"/>
    <path class="wall" d="M80,84 H122 V42 H158 V162 H122 V120 H80 z"/>
    <line class="port" x1="82" y1="84" x2="82" y2="120"/><line class="port" x1="122" y1="44" x2="158" y2="44"/><line class="port" x1="122" y1="160" x2="158" y2="160"/>
    <circle class="pivot" cx="140" cy="102" r="5"/>
  </g>
  <g data-family="cross" data-canonical-mask="1111" data-arms="N S W E" transform="translate(650 340)">
    <rect class="card" width="280" height="180" rx="12"/>
    <text class="label" x="16" y="28">cross</text><text class="detail" x="186" y="28">1111</text>
    <rect class="cell" x="80" y="42" width="120" height="120"/>
    <path class="wall" d="M80,84 H122 V42 H158 V84 H200 V120 H158 V162 H122 V120 H80 z"/>
    <line class="port" x1="82" y1="84" x2="82" y2="120"/><line class="port" x1="122" y1="44" x2="158" y2="44"/><line class="port" x1="198" y1="84" x2="198" y2="120"/><line class="port" x1="122" y1="160" x2="158" y2="160"/>
    <circle class="pivot" cx="140" cy="102" r="5"/>
  </g>

  <g data-view="bounds-and-pivot" transform="translate(30 555)">
    <rect class="card" width="900" height="245" rx="12"/>
    <text class="label" x="18" y="32">side view — raw local bounds and runtime placement</text>
    <line class="ground" x1="70" y1="198" x2="830" y2="198"/>
    <rect class="wall" x="390" y="70" width="120" height="128"/>
    <circle class="pivot" cx="450" cy="134" r="7"/>
    <line class="dimension" x1="350" y1="70" x2="350" y2="198"/>
    <text class="accent" x="270" y="138">32 wu</text>
    <text class="detail" x="525" y="76">local Y = +16</text>
    <text class="detail" x="525" y="139">origin / pivot = (0, 0, 0)</text>
    <text class="detail" x="525" y="196">local Y = −16</text>
    <text class="detail" x="70" y="224">placement center Y = 16 wu → world Y = 0..32 wu · node T/R/S = identity</text>
    <text class="detail" x="70" y="56">dashed cell envelope in top views = local X/Z −16..+16 wu; gold edges are 9.6 wu boundary ports</text>
  </g>
</svg>
